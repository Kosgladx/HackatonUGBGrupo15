<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, sans-serif;
            background:#dfe6ee; /* fundo mais escuro */
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:40px;
        }

        .container{
            background:white;
            width:500px;
            padding:35px;
            border-radius:24px;
            box-shadow:0 10px 30px rgba(0,0,0,0.12);
        }

        h1{
            text-align:center;
            margin-bottom:10px;
            color:#1f2f4a;
            font-size:34px;
        }

        .subtitle{
            text-align:center;
            color:#6b7280;
            margin-bottom:30px;
        }

        input, select{
            width:100%;
            padding:15px;
            margin-bottom:18px;

            border:1px solid #d1d5db; /* 👈 borda visível */
            border-radius:14px;

            background:#f9fafb;
            font-size:15px;
            transition:0.2s;
        }

        input:focus,
        select:focus{
            outline:none;
            background:white;
            border-color:#2563eb;
            box-shadow:0 0 0 3px rgba(37,99,235,0.15);
        }

        button{
            width:100%;
            padding:16px;
            border:none;
            border-radius:14px;
            background:#2563eb;
            color:white;
            font-size:17px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#1d4ed8;
            transform:translateY(-2px);
        }

        .tipo-box{
            display:flex;
            gap:18px;
            margin-bottom:25px;
        }

        .tipo{
            flex:1;
            padding:22px;
            border-radius:18px;
            background:#f8fafc;
            border:2px solid transparent;
            text-align:center;
            cursor:pointer;
            transition:0.3s;
        }

        .tipo:hover{
            transform:translateY(-3px);
            border-color:#2563eb;
        }

        .tipo strong{
            color:#1f2f4a;
            font-size:20px;
        }

        .tipo p{
            color:#6b7280;
            margin-top:10px;
            font-size:14px;
        }

        .tipo input{
            margin-top:18px;
            transform:scale(1.2);
            width:auto;
            padding:0;
            margin-bottom:0;
            background:transparent;
            box-shadow:none;
        }

        .erro{
            background:#ef4444;
            color:white;
            padding:14px;
            border-radius:12px;
            margin-bottom:20px;
            text-align:center;
            font-weight:bold;
        }

        .info-box{
            background:#f0fdf4;
            border:1px solid #bbf7d0;
            border-radius:14px;
            padding:14px 18px;
            margin-bottom:22px;
            display:flex;
            align-items:flex-start;
            gap:10px;
        }

        .info-box-blue{
            background:#eff6ff;
            border:1px solid #bfdbfe;
        }

        .info-icon{
            font-size:20px;
            flex-shrink:0;
            margin-top:1px;
        }

        .info-box p{
            color:#166534;
            font-size:14px;
            line-height:1.5;
        }

        .info-box-blue p{
            color:#1e40af;
        }

        .tipo-info{
            display:none;
            margin-bottom:6px;
        }

        .tipo-info.visible{
            display:block;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>Cadastro</h1>

    <p class="subtitle">Sistema de gerenciamento de monitoria</p>

    {% if erro %}
        <div class="erro">{{ erro }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="nome" placeholder="Nome completo" required>

        <input type="text" name="matricula" placeholder="Matrícula" required>

        <select name="periodo" required>
            <option value="">Selecione o período</option>
            <option value="1">1º período</option>
            <option value="2">2º período</option>
            <option value="3">3º período</option>
            <option value="4">4º período</option>
            <option value="5">5º período</option>
            <option value="6">6º período</option>
            <option value="7">7º período</option>
            <option value="8">8º período</option>
            <option value="9">9º período</option>
            <option value="10">10º período</option>
        </select>

        <input type="email" name="email" placeholder="Email" required>

        <input type="text" name="telefone" placeholder="24 999999999"
               pattern="[0-9]{2} [0-9]{9}" required>

        <input type="password" name="senha" placeholder="Senha" required>

        <div class="tipo-box">

            <label class="tipo">
                <strong>Integrante</strong>
                <p>Participante comum do sistema</p>
                <input type="radio" name="tipo" value="integrante"
                       onchange="mostrarInfo('integrante')" required>
            </label>

            <label class="tipo">
                <strong>Monitor</strong>
                <p>Responsável pelos grupos</p>
                <input type="radio" name="tipo" value="monitor"
                       onchange="mostrarInfo('monitor')">
            </label>

        </div>

        <div class="info-box info-box-blue tipo-info" id="info-integrante">
            <span class="info-icon">ℹ️</span>
            <p>Você será cadastrado <strong>sem grupo</strong>.</p>
        </div>

        <div class="info-box tipo-info" id="info-monitor">
            <span class="info-icon">ℹ️</span>
            <p>Você será monitor e poderá gerenciar grupos.</p>
        </div>

        <button type="submit">Cadastrar</button>

    </form>

</div>

<script>
function mostrarInfo(tipo) {
    document.getElementById('info-integrante').classList.remove('visible');
    document.getElementById('info-monitor').classList.remove('visible');
    document.getElementById('info-' + tipo).classList.add('visible');
}
</script>

</body>
</html>
